[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-subtitles-downloader"
version = "1.0.0"
description = "Cross-platform desktop app for downloading YouTube subtitles as SRT files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "TheRealRexo" }]
keywords = ["youtube", "subtitles", "srt", "yt-dlp", "pyqt6", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PyQt6>=6.6",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10",
    "Pillow>=10",
]

[project.gui-scripts]
youtube-subtitles-downloader = "youtube_subtitles_downloader.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
